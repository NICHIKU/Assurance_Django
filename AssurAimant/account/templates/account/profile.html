{% extends "base.html" %}

{% block title %}Profil{% endblock title %}
{% block content %}

<dl class="max-w-md text-heading divide-y divide-default">
    <div class="flex flex-col pb-3">
        <dt class="mb-1 text-body">Nom Complet</dt>
        <dd class="text-lg font-medium">{{ user.first_name }} {{ user.last_name }}</dd>
    </div>
    <div class="flex flex-col py-3">
        <dt class="mb-1 text-body">Adresse Mail</dt>
        <dd class="text-lg font-medium">{{ user.email }}</dd>
    </div>
    <div class="flex flex-col pt-3">
        <dt class="mb-1 text-body">Date d'inscription</dt>
        <dd class="text-lg font-medium">{{ user.date_joined }}</dd>
    </div>
</dl>

{% endblock content %}

{% block modify %}

<a href="{% url 'profile_modif' %}">Modifier le profil</a>

{% endblock modify %}
