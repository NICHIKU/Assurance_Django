{% extends "base.html" %}
{% block content %}
    
    <div class="flex flex-col items-center justify-center w-full">
        
        <div class="bg-white rounded-lg shadow-md p-8 w-full max-w-md">
            <h1 class="text-3xl font-bold text-center text-slate-800 mb-8">
                Créer un compte
            </h1>
            
            <form method="POST" class="space-y-4">
                {% csrf_token %}
                  <div class="text-slate-700 space-y-4">
                        {% for field in form %}
                        <div class="space-y-2 flex justify-between items-center">
                            {{ field.label_tag }}
                            <div class="border border-gray-300 rounded-lg p-0.5 inline-block">
                                {{ field }}
                            </div>
                        </div>
                        {% endfor %}
                    </div>

                <button type="submit" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-semibold py-3 px-4 rounded-lg transition duration-200 mt-6">
                    Créer mon compte
                </button>
            </form>
            
            <div class="mt-8 pt-6 border-t border-gray-100 text-center">
                <p class="text-slate-600">
                    Vous avez déjà un compte ? 
                    <a href="login" class="text-blue-600 hover:underline font-medium">Se connecter</a>
                </p>
            </div>
        </div>

    </div>

{% endblock %}
